<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>SmallWar Game MapEditor</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/Cell.css">
    <link rel="stylesheet" href="css/PlayerConfig.css">
    <link rel="stylesheet" href="css/MapEditor.css">
</head>
<body style="background: #121212; display: flex">
<script src="js/CellItem.js"></script>
    <!-- 左侧工具栏 -->
    <div class="l_tool">
        <!-- 地块选择刷 -->
        <div class="cell">
            <span class="cell_title">地块选项</span>
            <!-- 地块容器 -->
            <div class="cell_grid_div" id="cell_grid_div">
                <!-- 在此插入button -->
    <!--            <button class="cell_grid_button">-->
    <!--                <img src="" class="cell_grid_button" alt="ERROR">-->
    <!--                <span class="cell_grid_button">None</span>-->
    <!--            </button>-->
            </div>
            <script src="js/Cell.js"></script>
            <script>
                loadCellList()
            </script>
        </div>

        <!-- 玩家列表 -->
        <div class="player_config" id="player_config">
            <div style="display: flex">
                <span class="player_config_title">玩家设置</span>
                <!-- 设置button -->
                <div style="margin-left: auto;">
                    <button onclick="add_player()">
                        <span>添加玩家</span>
                    </button>
                    <button onclick="remove_player()">
                        <span>移除玩家</span>
                    </button>
                </div>
            </div>
            <div id="player_list" style="display: flex; flex-direction: column; overflow-y: auto">
                <!-- 标题 -->
                <div class="player_config_tab">
                    <span style="width: 20%">ID</span>
                    <span style="width: 20%">队伍</span>
                    <span style="width: 20%">颜色</span>
                    <span style="width: 40%">风格</span>
                </div>
                <!-- 在此插入玩家配置 -->
            </div>
            <script src="js/PlayerConfig.js"></script>
            <script>
                add_player()
            </script>
        </div>
    </div>

    <!-- 地图编辑区域 -->
    <div class="map_editor">
        <!-- 网格部分 -->
        <div class="map_editor_hex_map" id="map_editor_hex_map_div">
            <!-- 插入网格内容 -->
            <!-- 嵌入svg后, cell类为map_editor_hex_cell -->
        </div>
        <script src="js/MapEditor.js"></script>
        <script>
            buildHexMap(3, 3, 32, 32)
        </script>
    </div>
</body>
</html>
