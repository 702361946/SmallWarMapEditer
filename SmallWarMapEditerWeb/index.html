<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>SmallWar Game MapEditor</title>
</head>
<body>

<!-- 左侧工具栏 -->
<div class="l_tool">
    <!-- 地块选择刷 -->
    <div class="brush_options">
        <!-- 页面切换按钮容器 -->
        <div class="brush_options_switch_div" id="brush_options_switch_div">
            <!-- class is brush_options_switch_button -->
        </div>
        <div class="brush_options_table_div" id="brush_options_table_div">
            <!-- class is brush_options_table_grid -->
        </div>
    </div>

    <!-- 玩家列表 -->
    <div class="player_config" id="player_config">
        <div class="player_config_header">
            <span class="player_config_title">玩家设置</span>
            <!-- 设置button -->
            <div class="player_config_actions">
                <button onclick="addPlayer()">
                    <span>添加玩家</span>
                </button>
                <button onclick="removePlayer()">
                    <span>移除玩家</span>
                </button>
            </div>
        </div>
        <div id="player_list" style="display: flex; flex-direction: column; overflow-y: auto">
            <!-- 标题 -->
            <div class="player_config_tab">
                <span style="width: 20%">ID</span>
                <span style="width: 20%">队伍</span>
                <span style="width: 20%">颜色</span>
                <span style="width: 40%">风格</span>
            </div>
            <!-- 在此插入玩家配置 -->
        </div>
    </div>

    <div class="l_tool_bottom">
        <!-- 范围笔刷设置 -->
        <div class="brush_range_options" id="brush_range_options_div">
        </div>

        <!-- 地图选项区域 -->
        <div class="map_config_div" id="map_config">
            <div class="map_config_information_div">
                <span>当前地图大小</span>
                <span id="map_config_information_xy_span">(x&y)</span>
            </div>
            <div class="map_config_button_div" id="map_config_button_div">

            </div>
        </div>
    </div>
</div>

<!-- 地图编辑区域 -->
<div class="map_editor">
    <!-- 网格部分 -->
    <div class="map_editor_hex_map" id="map_editor_hex_map_div">
        <!-- 插入网格内容 -->
        <!-- 嵌入svg后, cell类为map_editor_hex_cell -->
    </div>
    <!-- 笔刷部分 -->
    <div>

    </div>
</div>

<!-- 导出按钮 -->
<div class="output_button_div" id="output_button_div">
</div>

<script src="./src/main.ts" type="module"></script>
</body>
</html>
